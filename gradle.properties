# ============================================================================
#  gradle.properties — THE BUILD SYSTEM'S SETTINGS PANEL
# ============================================================================
#
#  WHY THIS FILE EXISTS:
#  ---------------------
#  This file configures HOW Gradle itself behaves — not what it builds,
#  but how fast and how much memory it uses while building.
#  Think of it as tuning the engine of your build machine.
#
#  IMPORTANCE:
#  -----------
#  Without AndroidX enabled, you can't use any modern Android libraries.
#  Without enough memory (Xmx), large projects will crash during build.
# ============================================================================

# AndroidX is Google's modern set of Android libraries (replaced the old "Support Library").
# Every modern Android app MUST have this set to true.
android.useAndroidX=true

# This tells Gradle to use its own separate process (daemon) for building.
# Result: Faster builds because Gradle stays warm in memory between builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code options — tells the Kotlin compiler to output Java 8 bytecode
kotlin.code.style=official
